name: CI

# Runs on PRs into main, so it checks the merged result before it lands.
# Documents committed straight to main do not start it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w web
      - run: npm run typecheck -w web
      - run: npm run test -w web
      - run: npm run build -w web

  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: educonnect
          POSTGRES_PASSWORD: educonnect
          POSTGRES_DB: educonnect
        ports: ["15432:5432"] # same host ports as compose.yml, so the app defaults work
        options: --health-cmd "pg_isready -U educonnect" --health-interval 2s --health-retries 30
      redis:
        image: redis:8.10-alpine
        ports: ["16379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags after v7, so pin the release
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run alembic upgrade head
      - run: uv run pytest

  e2e:
    # The whole app in Docker, then every browser test (tests/*.e2e.ts): the regression run for all Issues together.
    runs-on: ubuntu-latest
    env:
      E2E_TELEMETRY_DISABLED: 1
      ENABLE_TEST_ROUTES: 1 # /api/test/* for seed reset, clock and the LLM double (arch AD-11)
      LLM_PROVIDER: fake # CI never calls Azure OpenAI (AC-10.3)
      SEED_PASSWORD: ci-synthetic-seed # synthetic; /api/test/reset loads the seed with it
      AZURE_OPENAI_ENDPOINT: https://educonnect-synthetic-ci.openai.azure.com/ # synthetic; TC-68 checks the app never shows its host
      # synthetic; TC-57 builds the web app with all five and searches the build output and every response
      AZURE_OPENAI_LOCATION: synthetic-ci-region
      AZURE_OPENAI_BASE_URL: https://educonnect-synthetic-ci.openai.azure.com/openai/v1/
      AZURE_OPENAI_API_KEY: synthetic-ci-key
      AZURE_OPENAI_DEPLOYMENT: synthetic-ci-deployment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx @e2e-dev/web install chromium --with-deps
      - uses: astral-sh/setup-uv@v10.2.0
      - run: docker compose up --build --wait
      - run: uv run --directory apps/api pytest -m compose_runtime tests/test_compose_ports.py # TC-77 running state: every published port is 127.0.0.1
      - run: npx e2e run --exclude-tag ai # tests tagged ai need a model key: run them locally before submitting
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: .e2e/
          if-no-files-found: ignore
