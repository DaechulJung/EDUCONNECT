# UX 범위와 완료 안내. CLI init이 프로젝트 _bmad/custom/에 복사하며, 프로젝트에서 고치거나 항목을 지워 끌 수 있다.
# 디자인 산출물 관련 기본 목록(creative_tools, design_md_examples)은 배열이라 덮어쓰지 못하므로 아래 지시로 끈다.
[workflow]
experience_file = "{project-root}/docs/experience.md"
ux_output_path = "{project-root}/.kode-harness-lite/workspaces/bmad-ux"
persistent_facts = [
  "이 프로젝트의 UX 산출물은 EXPERIENCE.md 하나다. DESIGN.md는 만들지 않는다. Create에서도 DESIGN.md 파일을 만들지 않고, Finalize·Update·Validate에서도 DESIGN.md를 작성하거나 요구하지 않는다.",
  "보이는 방식(색·글꼴·간격·컴포넌트 시각 사양)은 프로젝트가 정한 외부 디자인 시스템을 따른다. 시스템 이름과 출처는 project-context.md·입력 문서에서 찾고, 없으면 사용자에게 한 번 묻는다. 그 이름을 EXPERIENCE.md Foundation의 UI system으로 적고, 시각 사양을 새로 정의하지 않는다.",
  "EXPERIENCE.md는 DESIGN.md 토큰을 {path.to.token} 형식으로 참조하지 않는다. 시각 요소가 필요하면 디자인 시스템의 컴포넌트·토큰 이름을 그대로 쓰거나 생략한다.",
  "디자인 산출물 도구는 쓰지 않는다: 색 테마, 디자인 방향, 핵심 화면 HTML 목업, Excalidraw 와이어프레임, Design handoff(Stitch 등 외부 도구). Discovery는 Fast·Coaching 어느 방식이든 이 도구 없이 진행하고, Finalize의 목업 렌더링·목업 범위 확인·레이아웃 추출 단계는 건너뛴다.",
  "검사(rubric walker·Reviewer Gate·Validate)는 EXPERIENCE.md만 대상으로 한다. DESIGN.md 토큰 완성도, DESIGN.md.Components 대응, DESIGN.md 섹션 순서 항목은 해당 없음으로 처리한다.",
  "완료 시 EXPERIENCE.md frontmatter만 status: final로 바꾼다. 진행 중인 작업 확인(resume)은 DESIGN.md 대신 EXPERIENCE.md의 status로 판단한다.",
  "file:{project-root}/docs/intent.md",
  "docs/intent.md의 frontmatter status가 confirmed면 그 내용은 사용자가 확정한 것이다. 적힌 내용은 다시 묻지 않고 [ASSUMPTION]도 붙이지 않고 그대로 쓴다. '위임'으로 적힌 영역은 묻지 않고 직접 정해 memlog에 decision으로 남긴다. 사용자에게는 22장 '미정'의 항목과 intent.md·입력 문서 어디에도 없는 내용만 묻고, 그런 질문은 Discovery 시작에 한 번에 묶어 묻는다. status가 confirmed가 아니거나 파일이 없으면 이 규칙과 아래 진행 규칙을 쓰지 않고 intent.md를 일반 입력 자료로만 읽는다.",
  "확정된 intent.md가 있으면 진행 질문을 하지 않는다. 이 스킬의 산출물이 없으면 Create로 정한다. 다른 스킬로 보낼지, Fast·Coaching path, 시작점, 중요도(2장에서 읽는다)를 묻지 않는다. 쏟아내기·'더 있나요?'·입력 자료 확인을 생략하고 intent.md, 과제 공지, 앞 단계가 쓴 docs/ 문서를 입력으로 쓴다. 추론 확인, 초안 검토, 최종 확인, memlog 감사 공유를 하지 않고 Finalize까지 진행한다. Reviewer Gate는 메뉴를 묻지 않고 기본 검사만 실행한다. 명확한 지적은 고치고, intent.md와 충돌하는 지적은 intent.md를 따르고, 나머지는 Open Questions에 남긴다.",
  "UX는 intent.md의 2 프로젝트 성격, 4 사용자, 6 경쟁·대안(참고·피할 패턴), 7 사용 장면, 8 용어, 9 요구사항과 범위, 11 예외와 실패, 12 제약(접근성·표시 의무 문구), 13 경험 방향을 쓴다. Key Flows는 7 사용 장면을 그대로 옮긴다. 13장 '세부 화면 결정'이 위임이면 컴포넌트 규칙, 화면 문구, 상태별 동작을 묻지 않고 정한다.",
  "file:{project-root}/docs/project-brief.md",
  "file:{project-root}/docs/prd.md",
  "[setup] 상위 문서: brief {project-root}/docs/project-brief.md, prd {project-root}/docs/prd.md. 위 file: 항목으로 이미 읽었다. frontmatter status가 final인 상위 문서는 확정 입력으로 쓰고 거기 적힌 내용을 다시 묻지 않는다. status가 draft이거나 없는 문서는 아직 완성되지 않은 것이므로 참고만 하고 확정 입력으로 쓰지 않는다.",
  "[storage] 업스트림의 EXPERIENCE.md는 문서 종류 이름이며 실제 파일은 {workflow.experience_file}이다. Create·Update·Validate·Resume·Finalize·headless·리뷰·외부 handoff 모두 이 docs/ 파일을 직접 읽고 쓴다. DESIGN.md는 위 프로젝트 규칙대로 만들지 않는다. 실행 폴더에 제품 문서 사본을 만들거나 완료 후 복사하지 않는다. 이 경로 규칙이 업스트림의 작업 폴더 파일명 지시보다 우선한다.",
  "[storage] {doc_workspace}는 {workflow.ux_output_path}/{workflow.run_folder_pattern}/의 별도 실행 기록 폴더다. .memlog.md·검토·검증 결과·imports/ 등 실행 자료만 여기에 둔다. 사용자나 headless가 doc_workspace를 지정해도 제품 문서 경로는 바뀌지 않는다. 문서가 있는 docs/를 실행 기록 폴더로 쓰지 않는다. Update·Validate·Resume은 기존 실행 기록 폴더를 재사용하고 없으면 기본 실행 기록 폴더를 만든다. 입력 문서는 {project-root}/docs/에서 찾으며 이전 작업본 대신 최신 docs/ 문서를 읽는다.",
  "[storage] Create 전에 {workflow.experience_file}의 상태를 읽는다. status: draft면 이어 쓰고, final이면 변경을 Update로 처리하며, 상태가 없는 양식은 새 문서의 양식으로 본다. 작업 폴더 안의 EXPERIENCE.md 유무로 상태를 판단하지 않는다. Create에서 status: draft로 시작하고 성공한 Finalize에서 같은 파일의 status를 final로 바꾼다. 리뷰어와 handoff에 실제 docs/ 경로와 별도 실행 기록 폴더를 함께 전달한다.",
  "[setup] docs/experience.md 최종 문서는 양식 {project-root}/_bmad/custom/templates/experience_template.md의 제목 구조와 순서를 따른다. 양식에 자리가 없는 필수 내용은 섹션을 만들지 말고 사용자에게 묻는다.",
  "[setup] FLOW 식별자는 FLOW-01 형식(FLOW-\\d{2})으로 docs/experience.md에서 정의한다. 번호를 다시 매기지 않고 삭제한 번호는 재사용하지 않는다.",
  "[setup] FLOW마다 표의 \"요구\" 열에 연결된 REQ 식별자를 적는다.",
  "[setup] FLOW마다 표의 \"시험\" 열에 연결된 TC 식별자를 적는다.",
]
on_complete = """
0. [setup-check] 먼저 이번에 쓴 문서가 양식 구조를 지켰는지 검사한다: node "{skill-root}/../../src/cli.mjs" doc check --template "{project-root}/_bmad/custom/templates/experience_template.md" --doc "{project-root}/docs/experience.md". 실패하면 문제마다 문서를 양식의 제목·순서·표 열대로 고치고(양식을 바꿔서 맞추지 않는다) 통과할 때까지 다시 실행한다. 통과하기 전에는 다음 단계로 가지 않는다.
- [setup-push] 마지막으로 이번에 바뀐 문서를 기본 브랜치에 올린다. 이번 단계에서 고친 docs/ 문서와 .kode-harness-lite/ 안의 설정·실행 기록만 git add하고 git commit -m "docs: <문서 이름> 작성"(수정이면 "수정")으로 커밋한 뒤 git push한다. PC별 캐시와 다른 변경은 커밋하지 않는다. 현재 브랜치가 기본 브랜치가 아니면 브랜치를 바꾸지 말고 사용자에게 알린다. push가 거절되면 git pull --rebase 후 한 번 더 push하고, 충돌이 나면 멈추고 알린다. 브랜치 보호로 막히면 docs/<스킬> 브랜치로 올려 PR을 만들고 알린다. headless에서는 커밋만 하고 push하지 않는다.
7. [setup-next] 업스트림 Finalize의 다음 단계 추천(bmad-ticket, bmad-build 등)은 하지 않는다. 다음 단계로 bmad-architecture를 안내한다.
"""
experience_md_examples = [
  "{project-root}/_bmad/custom/templates/experience_template.md",
]
