# 아키텍처 완료 안내. CLI init이 프로젝트 _bmad/custom/에 복사하며, 프로젝트에서 고치거나 on_complete를 비워 끌 수 있다.
[workflow]
spine_file = "{project-root}/docs/arch.md"
spine_output_path = "{project-root}/.kode-harness-lite/workspaces/bmad-architecture"
# 로딩된 main의 파일 경로만 바꿔 원본 검사와 JSON 오류 처리를 그대로 재사용한다.
spine_lint_python = "import runpy, sys; from pathlib import Path; main = runpy.run_path(sys.argv[1])['main']; main.__globals__['SPINE'] = str(Path(sys.argv[2]).absolute()); main(['--workspace', '.'])"
# setup 뼈대를 깐 프로젝트에만 있는 파일. 기본값(project-context.md) 뒤에 붙는다.
persistent_facts = [
  "file:{project-root}/_bmad/custom/scaffold-context.md",
  "[storage] 업스트림의 ARCHITECTURE-SPINE.md는 문서 종류 이름이며 실제 파일은 {workflow.spine_file}이다. Create·Update·Validate·Resume·Finalize·headless·리뷰·Issue 분배·외부 handoff 모두 이 docs/ 파일을 직접 읽고 쓴다. 실행 폴더에 제품 문서 사본을 만들거나 완료 후 복사하지 않는다. 이 경로 규칙이 업스트림의 작업 폴더 파일명 지시보다 우선한다. 상위 아키텍처 입력은 사용자가 지정한 경로를 읽고 현재 spine_file과 혼동하지 않는다.",
  "[storage] {doc_workspace}는 {workflow.spine_output_path}/{workflow.run_folder_pattern}/의 별도 실행 기록 폴더다. .memlog.md·검토·검증 결과만 여기에 둔다. 사용자나 headless가 doc_workspace를 지정해도 제품 문서 경로는 바뀌지 않는다. 문서가 있는 docs/를 실행 기록 폴더로 쓰지 않는다. Update·Validate·Resume은 기존 실행 기록 폴더를 재사용하고 없으면 기본 실행 기록 폴더를 만든다. 이전 작업본 대신 최신 docs/ 문서를 읽는다. Epic별 설계는 spine_file과 run_folder_pattern을 둘 다 해당 Epic으로 한정한다.",
  "[storage] Update·Validate·Resume에서 변경을 기록하기 전에 {workflow.spine_file}와 별도 실행 기록을 읽는다. {doc_workspace}/.memlog.md가 없으면 uv run {project-root}/_bmad/scripts/memlog.py init --workspace \"{doc_workspace}\" --field scope=\"현재 docs/ 아키텍처\"로 초기화한다. 이어 현재 docs/ 문서의 기존 결정·제약·상위 문서 참조·AD 식별자를 uv run {project-root}/_bmad/scripts/memlog.py append --workspace \"{doc_workspace}\" --type decision --text \"<현재 결정과 원래 AD 식별자>\"로 복구한 뒤 새 변경을 기록한다. 기존 AD 번호와 변경 대상이 아닌 결정을 유지하며, 빈 메모나 오래된 작업본을 기준으로 현재 문서를 다시 쓰지 않는다. Validate는 제품 문서를 고치지 않는다.",
  "[storage] Create 전에 {workflow.spine_file}의 상태를 읽는다. status: draft면 이어 쓰고, final이면 변경을 Update로 처리하며, 상태가 없는 양식은 새 문서의 양식으로 본다. 작업 폴더 안의 ARCHITECTURE-SPINE.md 유무로 상태를 판단하지 않는다. Create에서 status: draft로 시작하고 성공한 Finalize에서 같은 파일의 status를 final로 바꾼다. 리뷰어와 handoff에 실제 docs/ 경로와 별도 실행 기록 폴더를 함께 전달한다.",
  "[storage] Reviewer Gate·Validate·headless의 결정적 검사는 원본 lint_spine.py를 수정하거나 작업 폴더에 문서를 복사하지 않고 실행한다: uv run python -c \"{workflow.spine_lint_python}\" \"{skill-root}/scripts/lint_spine.py\" \"{workflow.spine_file}\". 이는 업스트림의 lint_spine.py --workspace 호출을 대신한다. JSON의 ok·findings를 읽고 나머지 Reviewer Gate를 그대로 진행한다.",
  "file:{project-root}/docs/intent.md",
  "docs/intent.md의 frontmatter status가 confirmed면 그 내용은 사용자가 확정한 것이다. 적힌 내용은 다시 묻지 않고 [ASSUMPTION]도 붙이지 않고 그대로 쓴다. '위임'으로 적힌 영역은 묻지 않고 직접 정해 memlog에 decision으로 남긴다. 사용자에게는 22장 '미정'의 항목과 intent.md·입력 문서 어디에도 없는 내용만 묻고, 그런 질문은 Discovery 시작에 한 번에 묶어 묻는다. status가 confirmed가 아니거나 파일이 없으면 이 규칙과 아래 진행 규칙을 쓰지 않고 intent.md를 일반 입력 자료로만 읽는다.",
  "확정된 intent.md가 있으면 진행 질문을 하지 않는다. 이 스킬의 산출물이 없으면 Create로 정한다. 다른 스킬로 보낼지, Fast·Coaching path, 시작점, 중요도(2장에서 읽는다)를 묻지 않는다. 쏟아내기·'더 있나요?'·입력 자료 확인을 생략하고 intent.md, 과제 공지, 앞 단계가 쓴 docs/ 문서를 입력으로 쓴다. 추론 확인, 초안 검토, 최종 확인, memlog 감사 공유를 하지 않고 Finalize까지 진행한다. Reviewer Gate는 메뉴를 묻지 않고 기본 검사만 실행한다. 명확한 지적은 고치고, intent.md와 충돌하는 지적은 intent.md를 따르고, 나머지는 Open Questions에 남긴다.",
  "아키텍처는 intent.md의 2 프로젝트 성격, 9 요구사항과 범위, 12 제약, 14 연동과 데이터, 15 기술과 운영과 scaffold-context.md를 쓴다. 확정된 intent.md가 있으면 산출물은 스파인 하나(purpose build-substrate, altitude feature)로 정하고 목적·독자·고도를 묻지 않으며 추가 렌더링을 제안하지 않는다. 15장 '그 밖의 설계 결정'이 위임이면 패러다임, 경계, 이름·형식 규칙 같은 결정도 대안을 고르게 하지 않고 직접 정한다. 작업 분배표 승인은 그대로 받는다.",
]
on_complete = """
7. [작업 분배] 대화형 Create·Update가 정상적으로 끝났을 때만 한다(Validate·headless·blocked에서는 하지 않는다). 그때는 이 단계를 건너뛰지 않는다. 목적은 PRD로 등록된 Issue를 이 설계대로 최대한 병렬로 개발하게 하는 것이다. 개발자 수는 .kode-harness-lite/docs-map.json의 developers를 쓴다. 없으면 질문 도구(Claude Code: AskUserQuestion, 다른 호스트는 그 입력 도구, 없으면 일반 질문)로 묻는다. 질문에는 왜 지금 묻는지 적는다(예: "설계가 끝났습니다. 등록된 Issue를 개발자별로 나눠 동시에 개발하려고 합니다. 개발자는 몇 명인가요?"). 보기는 3(기본)·2·4·1. 사용자가 무엇인지 되물으면 설명하고 다시 묻는다. (a) 기반 Issue: 이 설계의 공통 계약(API 경로·스키마와 라우트 껍데기, DB 모델·마이그레이션, 공통 레이아웃)을 정하는 작업이 필요하면 다른 Issue처럼 kode에 등록해 모니터·완료 조건·근거로 추적한다. 아키텍처 문서를 원문으로 등록하고(node "{skill-root}/../../src/cli.mjs" source register --prd architecture --id architecture --path <아키텍처 docs/ 경로> --json), 등록 JSON의 document는 이 아키텍처 문서(id "architecture", 반환된 sha256을 version), requirements에는 기반 작업 하나를 role "requirement"로 넣는다. title은 "기반 작업: <계약 요약>"처럼 읽기 쉬운 이름으로 쓰고(URL·Issue 번호를 넣지 않는다), body는 프로젝트 Issue 양식대로 쓰고, sourceRefs는 계약을 정한 아키텍처 섹션 위치, conditions는 확인 가능한 계약 단위로 쓴다(예: API 스키마·라우트 껍데기 커밋, 마이그레이션 적용, npm run gen:api로 웹 클라이언트 생성, npm run check 통과). register --input <json> --dry-run으로 확인한 뒤 register --input <json> --json으로 등록한다. 다시 실행하면 같은 원문 연결로 그 Issue를 재사용한다. 예전 지침으로 kode: 라벨 없이 만든 기반 Issue가 열려 있으면, 새로 등록한 Issue로 dev:N 라벨과 선행 관계를 옮기고 예전 Issue는 "kode 추적 Issue #<새 번호>로 대체" 코멘트를 남겨 닫는다(표 확인 때 함께 보여 준다). 추적되지 않는 Issue를 만들지 않는다. (b) 선행 관계: node "{skill-root}/../../src/cli.mjs" list의 요구사항 Issue마다, 설계 기준으로 시작 전에 끝나야 하는 Issue를 이유와 함께 정한다. 계약만 정해지면 동시에 만들 수 있는 기능끼리는 서로 걸지 않고 기반 Issue에만 건다. 진짜 데이터·흐름 의존만 기능끼리 건다. relations <번호>에 이미 있는 관계는 건너뛴다. 개발자가 1명이어도 선행 관계는 건다. (c) 분배(개발자 2명 이상): 설계의 작업 흐름대로 기능을 세로 단위(화면·API·테이블)로 한 사람에게 주고, 같은 모듈·테이블을 고치는 기능은 한 사람에게 묶고, 완료 조건 수로 양을 맞춘다. 기반 Issue는 한 사람이 맡고, 나머지는 그동안 기반에 의존하지 않는 일(화면 정적 구성, 시험 시나리오)부터 하도록 권장 순서를 적는다. Issue that already carries a dev:N label는 그대로 둔다(다시 실행하거나 요구가 바뀌어도 기존 분담 유지, 새 Issue만 분배). (d) 표 하나(Issue, 선행·이유, 개발자, 권장 순서)로 확인받은 뒤 적용한다: node "{skill-root}/../../src/cli.mjs" relate <번호> --blocked-by <선행 번호>, gh label create dev:N --force, gh issue edit <번호> --add-label dev:N. 보고에 개발자별 목록과 is:open label:dev:N 필터를 적는다.
8. [setup-next] 업스트림 Close·External handoffs의 다음 단계 추천(bmad-spec, bmad-create-epics-and-stories, bmad-build, bmad-help 등)은 하지 않는다. 다른 스킬을 자동 호출하지도 않는다.
대화형 Create·Update가 정상적으로 끝났을 때만 이번에 완성한 ARCHITECTURE-SPINE.md와 실제 입력으로 쓴 PRD·EXPERIENCE 경로를 알리고, 기획 문서가 갖춰져 개발 준비가 완료되었다고 안내한다. Validate·headless·blocked에서는 안내하지 않고 기존 출력 계약을 그대로 지킨다.
"""
