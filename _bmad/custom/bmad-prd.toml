# Project PRD workflow using the bundled CLI.
[workflow]
prd_file = "{project-root}/docs/prd.md"
prd_output_path = "{project-root}/.kode-harness-lite/workspaces/bmad-prd"
prd_template = "{project-root}/_bmad/custom/prd-template.md"
validation_checklist_template = "{project-root}/_bmad/custom/prd-validation-checklist.md"
persistent_facts = [
  "Preserve the source document format and identifiers. Never require FR/C/NFR or REQ/AC/FLOW/TC prefixes. Identify requirements, acceptance criteria, user flows and tests by meaning and explicit references.",
  "GitHub Issue bodies and native labels, assignees, parent and dependency relations are the traceability source. No tracking YAML or managed comments.",
  "At completion, prepare schemaVersion=2 JSON with document, requirements, unresolved. Each requirement carries body (Markdown written in the shape of the project Issue template) plus card metadata. Use sourceRefs for actual document locations. CLI owns validation and progress updates.",
  "Shape 지시 중 \"FRs nested with globally numbered stable IDs\"(FR-1~FR-N 번호)는 이 프로젝트에서 따르지 않는다. 제품 요구사항 문서의 실제 구조와 원문 식별자를 보존하고, 식별자 접두어나 번호 체계를 강요하지 않는다. 기능과 품질 제약은 필요할 때 묶는다.",
  "입력 자료와 Issue 추적: 실제로 읽은 자료는 CLI source register로 등록하고 원문 버전과 위치를 sourceRefs에 기록한다. 제품 요구사항 문서의 실제 형식과 원문 식별자를 보존하며 기능·품질·혼합·미분류는 조회용 분류로만 사용한다. 빈칸·예시·배경·범위 제외를 구현 요구사항으로 등록하지 않는다. 모호한 항목은 unresolved에 남기고 추측하지 않는다.",
  "Finalize의 Issue 등록: 프로젝트 Issue 템플릿(.github/ISSUE_TEMPLATE/의 Markdown 또는 YAML form)을 읽어 요구사항마다 그 모양대로 본문(body)을 쓰고, 카드 정보(제목·설명·완료 조건·확인 방식·출처)는 메타데이터 필드로 담은 schemaVersion: 2 JSON을 만들어 CLI register --input <json> --dry-run, register --input <json> --json으로 검증·등록한다. 진행 중인 Issue는 재사용하고 완료 요구사항의 변경 개발은 원본을 유지한 하위 작업으로 등록한다. 추적 YAML이나 관리 댓글은 만들지 않는다. 실제 코드·시험·검토 결과만 set으로 기록하며, 자동 시험이 기본이고 사람 확인은 이유·방법이 필요한 예외다. 세부 순서는 on_complete를 따른다.",
  "보안 항목 매핑: 주최 측 보안 기준 security-policy.md(setup이 persistent_facts로 불러온 파일, 없으면 프로젝트 루트의 docs/ 또는 doc/에서 찾는다)가 있을 때만 한다. 이 파일은 고치지 않고 항목 ID·이름을 그대로 쓴다. 요구사항마다 관련 항목 ID를 **Security:** 줄에 적고 없으면 해당 없음이라 적는다. 항목이 붙은 요구사항의 완료 조건에는 항목 ID(예: [SEC-03])를 앞에 붙여 정상 결과와 거부 결과를 함께 쓴다. PRD 끝 Security Mapping 표에 기준의 모든 항목을 적용 / 해당 없음(이유) / 미정으로 정하고 대응 요구사항을 적는다. 미정은 Open Questions에도 올린다. 항목을 채우려고 해당하지 않는 기능(인증 등)을 새로 만들지 않는다. Issue 등록 때 완료 조건 문구의 항목 ID를 그대로 옮긴다. 기준 파일이 없으면 **Security:** 줄과 표를 넣지 않는다.",
  "[storage] 업스트림의 prd.md는 문서 종류 이름이며 실제 파일은 {workflow.prd_file}이다. Create·Update·Validate·Resume·Finalize·headless·리뷰·Issue 등록·외부 handoff 모두 이 docs/ 파일을 직접 읽고 쓴다. 실행 폴더에 제품 문서 사본을 만들거나 완료 후 복사하지 않는다. 이 경로 규칙이 업스트림의 작업 폴더 파일명 지시보다 우선한다.",
  "[storage] {doc_workspace}는 {workflow.prd_output_path}/{workflow.run_folder_pattern}/의 별도 실행 기록 폴더다. .memlog.md·addendum.md·검토·검증 결과만 여기에 둔다. 사용자나 headless가 doc_workspace를 지정해도 제품 문서 경로는 바뀌지 않는다. 문서가 있는 docs/를 실행 기록 폴더로 쓰지 않는다. Update·Validate·Resume은 기존 실행 기록 폴더를 재사용하고 없으면 기본 실행 기록 폴더를 만든다. 이전 작업본 대신 최신 docs/ 문서를 읽는다.",
  "[storage] Create 전에 {workflow.prd_file}의 상태를 읽는다. status: draft면 이어 쓰고, final이면 변경을 Update로 처리하며, 상태가 없는 양식은 새 문서의 양식으로 본다. 작업 폴더 안의 prd.md 유무로 상태를 판단하지 않는다. Create에서 status: draft로 시작하고 성공한 Finalize에서 같은 파일의 status를 final로 바꾼다. 리뷰어와 handoff에 실제 docs/ 경로와 별도 실행 기록 폴더를 함께 전달한다.",
  "file:{project-root}/docs/intent.md",
  "docs/intent.md의 frontmatter status가 confirmed면 그 내용은 사용자가 확정한 것이다. 적힌 내용은 다시 묻지 않고 [ASSUMPTION]도 붙이지 않고 그대로 쓴다. '위임'으로 적힌 영역은 묻지 않고 직접 정해 memlog에 decision으로 남긴다. 사용자에게는 22장 '미정'의 항목과 intent.md·입력 문서 어디에도 없는 내용만 묻고, 그런 질문은 Discovery 시작에 한 번에 묶어 묻는다. status가 confirmed가 아니거나 파일이 없으면 이 규칙과 아래 진행 규칙을 쓰지 않고 intent.md를 일반 입력 자료로만 읽는다.",
  "확정된 intent.md가 있으면 진행 질문을 하지 않는다. 이 스킬의 산출물이 없으면 Create로 정한다. 다른 스킬로 보낼지, Fast·Coaching path, 시작점, 중요도(2장에서 읽는다)를 묻지 않는다. 쏟아내기·'더 있나요?'·입력 자료 확인을 생략하고 intent.md, 과제 공지, 앞 단계가 쓴 docs/ 문서를 입력으로 쓴다. 추론 확인, 초안 검토, 최종 확인, memlog 감사 공유를 하지 않고 Finalize까지 진행한다. Reviewer Gate는 메뉴를 묻지 않고 기본 검사만 실행한다. 명확한 지적은 고치고, intent.md와 충돌하는 지적은 intent.md를 따르고, 나머지는 Open Questions에 남긴다.",
  "PRD는 intent.md 2~18장을 쓴다. 사용자 여정(UJ)은 7 사용 장면을 그대로 옮긴다(사용자가 확정한 장면이므로 [ASSUMPTION]이 아니다). 용어집은 8 용어, 범위·제외·Non-Goals는 9 요구사항과 범위, 확인 조건의 값과 예외는 10 규칙과 수치·11 예외와 실패, 보안 항목 판정은 12 제약, Adapt-In 섹션은 13~15장과 18 해당 없음, 성공 지표는 16 성공 기준, 확인 방식(자동 시험·사람 확인)은 17 시험 정책을 쓴다. 확인 조건은 한 줄(표 행이나 목록 한 항목) 안에 전제 상태, 입력 값, 관찰 가능한 기대 결과를 모두 담는다. e2e-doc이 그 한 줄만 읽고 시험을 쓰기 때문이다.",
]
on_complete = """
1. Read the actual PRD and the project Issue template under .github/ISSUE_TEMPLATE/ (Markdown or YAML issue form, any heading levels or sections). If none exists, write a short plain description as body. Preserve original IDs and use unclassified for clear requirements with uncertain type. Do not turn placeholders, examples or scope exclusions into work.
2. Register actually read input documents with node "{skill-root}/../../src/cli.mjs" source register --prd <document> --id <source> --path <file> --json. Use returned sha256 and original position units in sourceRefs; do not invent evidence or locations.
3. Write transient registration JSON: schemaVersion=2, document={id,title,path,version}, requirements=[{body,originalId,title,text,classification,role,sourceRefs,conditions}], unresolved=[]. body follows the template shape exactly and must not contain the tracking summary "추적 정보 (kode 자동 관리)"; the CLI appends that collapsed section itself. title is "<originalId> <requirement name>" (for example "REQ-01 회원가입"), the short readable label people and the trace map show; without an originalId use the name alone; never put a URL, an Issue number or markdown in title. text is the short card description. Classification: functional/quality/mixed/unclassified. Each condition has text (keep the PRD's security item prefix such as [SEC-03] so security-compliance.md can find conditions by item ID), verificationScope (functional-condition/evidence-only/needs-review), sourceRefs if known. Confirmed human verification has verify=manual, verify_reason and verify_by=prd. Missing functional verification defaults to test when work starts.
4. Run node "{skill-root}/../../src/cli.mjs" register --input <json> --dry-run. Resolve ambiguous source-to-Issue matches. Do not rely on a fixed PRD heading or ID regex. Then register --input <json> --json. Existing open work is updated; completed requirement changes create/reuse child work and preserve the closed parent. An unknown changeReason remains absent. Every unresolved item the register output returns (and every item you left in the JSON unresolved list) goes into the PRD Open Questions section with its reason, in the same PRD edit as step 5; it is not tracked anywhere else.
5. Read the returned links (originalId, location, issueNumber, url, role, parentIssue). Show the exact proposed PRD edits adding representative and change-work Issue links beside each source requirement. In the PRD write the Issue as #<issue-number> (GitHub links it), in the template's Issue column when it has one, otherwise right after the requirement row or heading; never a raw URL, and never inside or in place of the requirement name cell, which the trace map reads as the title. Modify the PRD only after the user confirms those edits. When this run is an Update started by kode-change, the user already approved the change there: apply these link edits without asking again. Preserve all other structure and content.
6. Verify the Issue data with CLI get <issue-number> [--item <condition-id>]; report errors. Interactive runs then always launch monitor --repo <owner/repo> --prd <document.id from the registration JSON, not the file path> --open in an independently managed terminal/service. Share its URL and any browser launch warning. Headless runs do not open browsers. Use CLI help --brief only when needed; never ask to enable MCP.
7. [setup-next] 업스트림 Close의 다음 단계 추천(bmad-create-epics-and-stories, bmad-help 등)은 하지 않는다. 다음 단계로 bmad-ux(사용자 흐름·화면 설계), 그다음 bmad-architecture를 안내한다.
"""
