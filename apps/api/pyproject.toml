[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.142",
    "pgvector>=0.5",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = ["httpx2>=2.13", "pytest>=9.1", "ruff>=0.16"]  # httpx2: what starlette.testclient uses

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the alembic/ folder here is migrations, not the package

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
