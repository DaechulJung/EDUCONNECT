<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDS 2.0 예시 — 모바일 요금 납부</title>
  <link rel="stylesheet" href="../tokens/kds-tokens.css">
  <link rel="stylesheet" href="../tokens/kds-base.css">
  <link rel="stylesheet" href="../tokens/kds-components.css">
  <link rel="stylesheet" href="examples.css">
</head>
<body>
  <!-- 요금납부 > 즉시납부 (KDS 2.0 디자인 시안 기준 예시)
       · 테두리 카드 없음 — 평평한 섹션 + 8px 회색 띠(.section-gap)로 구분
       · 하단 CTA: 회색(보조) + 검정(주요) 반반. KT 레드 없음 -->
  <div class="mo-frame">
    <header class="kds-topnav">
      <button class="kds-topnav__brand" aria-label="서비스 선택">
        <img src="../images/logo_kt.svg" alt="KT">
        <span class="kds-icon kds-icon--16" style="--icon: url(../icons/ic-line-chevron_down.svg)" aria-hidden="true"></span>
      </button>
      <div class="kds-topnav__actions">
        <button class="kds-icon-button" aria-label="검색"><span class="kds-icon" style="--icon: url(../icons/ic-line-search.svg)" aria-hidden="true"></span></button>
        <button class="kds-icon-button" aria-label="전체 메뉴"><span class="kds-icon" style="--icon: url(../icons/ic-line-menu.svg)" aria-hidden="true"></span></button>
      </div>
    </header>

    <div class="kds-info-band body-small-medium">
      <span>모바일</span><span>010-12**-*678</span>
    </div>

    <main>
      <section class="kds-section" aria-labelledby="amount-label">
        <a class="text-link caption-medium-semibold" href="#">우리가족대표 가족 조회
          <span class="kds-icon kds-icon--16" style="--icon: url(../icons/ic-line-chevron_right.svg)" aria-hidden="true"></span></a>
        <div class="kds-kv">
          <h1 id="amount-label" class="body-small-bold">납부하실 금액</h1>
          <p class="heading-medium-bold">58,000원</p>
        </div>
        <a class="promo body-small-medium" href="#">
          <span class="coin" aria-hidden="true"></span>
          <span><b>캐시리워드로</b> <span class="muted">통신비 절약하기</span></span>
          <span class="kds-icon kds-icon--16" style="--icon: url(../icons/ic-line-chevron_right.svg)" aria-hidden="true"></span>
        </a>

        <h2 class="body-medium-bold" style="margin-top: var(--space-8)">총 2개의 청구 내역</h2>
        <div class="stack body-small-medium" style="gap: var(--space-12)">
          <div class="kds-kv"><span class="muted">26년 04월</span><span class="body-small-bold">126,000원</span></div>
          <div class="kds-kv">
            <span class="muted">26년 03월<span class="sep"></span><span class="critical">미납</span></span>
            <a class="kds-kv__value body-small-bold" href="#" style="color: inherit; text-decoration: none">36,000원
              <span class="kds-icon kds-icon--16" style="--icon: url(../icons/ic-line-chevron_right.svg)" aria-hidden="true"></span></a>
          </div>
        </div>
      </section>

      <hr class="kds-divider-band">

      <ul class="kds-list body-small-medium">
        <li><a href="#">요금 납부 안내<span class="kds-icon kds-icon--20" style="--icon: url(../icons/ic-line-chevron_right.svg)" aria-hidden="true"></span></a></li>
        <li><a href="#">납부 수단별 안내<span class="kds-icon kds-icon--20" style="--icon: url(../icons/ic-line-chevron_right.svg)" aria-hidden="true"></span></a></li>
      </ul>
    </main>

    <div class="kds-cta-bar">
      <button class="kds-button kds-button--secondary kds-button--large label-medium-semibold">일부 납부</button>
      <a class="kds-button kds-button--primary kds-button--large label-medium-semibold" href="mobile-pay-method.html" style="text-decoration: none">한 번에 납부</a>
    </div>
  </div>
</body>
</html>
